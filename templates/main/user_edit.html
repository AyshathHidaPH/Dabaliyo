{% extends "user/index.html" %}
{% load static %}

{% block title %}
<title>Edit User</title>
{% endblock %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/user_edit.css' %}">
{% endblock %}


{% block content %}

<div class="container edit-page">

    <div class="edit-card">

        <h2>Edit User</h2>

        <div class="title-line"></div>


        <form
            method="POST"
            action="{% url 'user_edit' user.id %}"
        >

            {% csrf_token %}


            <div class="mb-4">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    value="{{ user.username }}"
                    class="form-control"
                >

            </div>


            <div class="mb-4">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ user.email }}"
                    class="form-control"
                >

            </div>


            <div class="edit-buttons">

                <a
                    href="{% url 'user_details' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
