{% extends "user/index.html" %}
{% load static %}
{% block title %}
<title> dashboard edit Page </title>
{% endblock %}
{% block style %}
<link rel="stylesheet" href="{% static 'css/index.css' %}">
<link rel="stylesheet" href="{% static 'css/product_edit.css' %}">
{% endblock %}
{% block content %}




<div class="container-fluid py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 py-5">
            <div class="form-card">

                <h3 class="form-title">Product_edit</h3>
                <form action="{% url 'product_edit' product.id %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <label>Product Name</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}">

                    <label>Price</label>
                    <input type="number" name="price" class="form-control" value="{{ product.price }}">

                    <label>Stock</label>
                    <input type="number" name="stock" class="form-control" value="{{ product.stock }}">

                    <label>Description</label>
                    <textarea name="description" class="form-control">{{ product.description }}</textarea>

                    <label>Brand</label>
                    <select name="brand" class="form-control">
                        {% for brand in brands %}
                        <option value="{{ brand.id }}" >
                            {{ brand.name }}
                        </option>
                        {% endfor %}
                    </select>

                    <label>Color</label>
                    <select name="color" class="form-control">
                        {% for color in colors %}
                        <option value="{{ color.id }}" >
                            {{ color.color }}
                        </option>
                        {% endfor %}
                    </select>

                    <label>Storage</label>
                    <select name="storage" class="form-control">
                        {% for storage in storages %}
                        <option value="{{ storage.id }}" >
                            {{ storage.size }}
                        </option>
                        {% endfor %}
                    </select>

                    <br>

                    {% if product.image %}
                    <img src="{{ product.image.url }}" width="120" class="mb-3">
                    {% endif %}

                    <input type="file" name="photo" class="form-control">
                    <br>
                    <button type="submit" class="btn btn-primary w-100">
                        Update Product
                    </button>
                </form>
            </div>
        </div>



        {% endblock %}
